name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:type

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [node_server, vercel, netlify, cloudflare_module]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - if: matrix.preset == 'cloudflare_module'
        run: |
          cp examples/cloudflare/console.config.ts.example console.config.ts
          cp examples/cloudflare/wrangler.jsonc wrangler.jsonc
          cp examples/cloudflare/.dev.vars.example .dev.vars
          pnpm cf:typegen
          pnpm test:type
      - run: NODE_ENV=production NITRO_PRESET=${{ matrix.preset }} pnpm exec vite build
      - if: matrix.preset == 'cloudflare_module'
        run: pnpm exec wrangler deploy --dry-run
      - if: matrix.preset == 'cloudflare_module'
        run: pnpm test:cloudflare
      - if: matrix.preset == 'node_server'
        run: pnpm test:node

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hot-updater-console .

  npm-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11
      - run: npm install
      - run: npm run test:type
      - run: npm run build:node
      - run: npm run test:node
      - run: |
          cp examples/cloudflare/console.config.ts.example console.config.ts
          cp examples/cloudflare/wrangler.jsonc wrangler.jsonc
          cp examples/cloudflare/.dev.vars.example .dev.vars
          npm run cf:typegen
          npm run test:type
      - run: npm run build:cloudflare
      - run: npm run test:cloudflare

  backend-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: aws
            package: '@hot-updater/aws'
          - example: firebase
            package: '@hot-updater/firebase'
            extra-packages: 'firebase-admin firebase-functions'
          - example: supabase
            package: '@hot-updater/supabase'
          - example: cloudflare-node
            package: '@hot-updater/cloudflare'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11
      - run: npm install
      - name: Install backend matching the console version
        run: |
          HOT_UPDATER_VERSION=$(node -p "require('./package.json').dependencies['@hot-updater/console']")
          npm install --no-save --package-lock=false "${{ matrix.package }}@$HOT_UPDATER_VERSION" ${{ matrix.extra-packages }}
      - run: cp examples/${{ matrix.example }}/console.config.ts.example console.config.ts
      - run: npm run test:type
      - run: npm run build:node
      - run: npm run test:node
