name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:type

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [node_server, vercel, netlify, cloudflare_module]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - if: matrix.preset == 'cloudflare_module'
        run: |
          cp examples/cloudflare/hot-updater.config.ts.example hot-updater.config.ts
          cp examples/cloudflare/wrangler.jsonc wrangler.jsonc
          pnpm cf:typegen
          pnpm test:type
      - run: NODE_ENV=production NITRO_PRESET=${{ matrix.preset }} pnpm exec vite build
      - if: matrix.preset == 'cloudflare_module'
        run: pnpm exec wrangler deploy --dry-run
      - if: matrix.preset == 'cloudflare_module'
        run: pnpm test:cloudflare
      - if: matrix.preset == 'node_server'
        run: pnpm test:node

  npm-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11
      - run: npm install
      - run: npm run test:type
      - run: npm run build:node
      - run: npm run test:node
      - run: |
          cp examples/cloudflare/hot-updater.config.ts.example hot-updater.config.ts
          cp examples/cloudflare/wrangler.jsonc wrangler.jsonc
          npm run cf:typegen
          npm run test:type
      - run: npm run build:cloudflare
      - run: npm run test:cloudflare
